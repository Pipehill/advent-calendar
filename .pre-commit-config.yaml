minimum_pre_commit_version: '4.6.2'
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: no-commit-to-branch
        additional_dependencies: [ruamel.yaml==0.18.16]
        args: [--branch, main]
        always_run: true
        pass_filenames: false
  - repo: local
    hooks:
      - id: staged-quality
        name: Staged code quality (check only)
        entry: node tools/quality/run.mjs staged
        language: system
        always_run: true
        pass_filenames: false
