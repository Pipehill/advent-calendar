name: advent-calendar
services:
  database:
    # PostgreSQL 18.4, official multi-platform manifest.
    image: docker.io/library/postgres:18.4@sha256:4cc13dede823cab4e05290c7fb3350fb4e599ecabd9b07e6706b5d5e8f5bc929
    environment:
      POSTGRES_DB: advent
      POSTGRES_USER: advent
      POSTGRES_PASSWORD: local-development
      POSTGRES_INITDB_ARGS: --encoding=UTF8
    ports:
      - "127.0.0.1:${DATABASE_PORT:-5432}:5432"
    volumes:
      - development-database:/var/lib/postgresql
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U advent -d advent"]
      interval: 2s
      timeout: 3s
      retries: 30
  backend:
    build:
      context: .
      dockerfile: src/backend/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Calendar: >-
        Host=database;Database=advent;Username=advent;Password=local-development;Timeout=3;Command Timeout=5
      LocalSeed__Enabled: "true"
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8080"
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: [CMD, dotnet, Calendar.Api.dll, --health-probe]
      interval: 3s
      timeout: 5s
      retries: 30
volumes:
  development-database:
