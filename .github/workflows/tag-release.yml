name: Tag release
on:
  pull_request:
    branches: [deploy]
    types: [closed]
permissions: {}
concurrency:
  group: tag-release
  cancel-in-progress: false
jobs:
  tag:
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.ref == 'main' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: read
    steps:
      - name: Set up Node LTS
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: 24.14.0
          token: ''
      # No checkout or repository code execution in the write-token job.
      - name: Finalize exact merged release using GitHub API only
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const event = JSON.parse(fs.readFileSync(process.env.GITHUB_EVENT_PATH, 'utf8'));
          const pr = event.pull_request;
          const repository = process.env.GITHUB_REPOSITORY;
          const sha = pr.merge_commit_sha;
          if (!pr.merged || pr.base.ref !== 'deploy' || pr.head.ref !== 'main' ||
              pr.head.repo?.full_name !== repository || pr.base.repo?.full_name !== repository ||
              !/^[a-f0-9]{40}$/.test(sha)) throw new Error('Invalid merged release provenance');
          const api = async (path, method = 'GET', body) => {
            const response = await fetch(`https://api.github.com/repos/${repository}/${path}`, {
              method,
              headers: {
                Authorization: `Bearer ${process.env.GITHUB_TOKEN}`,
                Accept: 'application/vnd.github+json',
                'X-GitHub-Api-Version': '2022-11-28',
              },
              body: body === undefined ? undefined : JSON.stringify(body),
            });
            if (response.status === 404 && method === 'GET') return null;
            if (!response.ok) throw new Error(`GitHub API ${path}: HTTP ${response.status}`);
            return response.json();
          };
          const read = async path => {
            const result = await api(`contents/${path}?ref=${sha}`);
            if (!result || result.encoding !== 'base64') throw new Error(`Missing release input ${path}`);
            return Buffer.from(result.content, 'base64').toString('utf8');
          };
          const [versionText, frontendText, contractText, merge, source] = await Promise.all([
            read('VERSION'), read('src/frontend/package.json'), read('src/contract/openapi.json'),
            api(`git/commits/${sha}`), api(`git/commits/${pr.head.sha}`),
          ]);
          const version = versionText.trim();
          if (!/^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/.test(version) ||
              JSON.parse(frontendText).version !== version || JSON.parse(contractText).info.version !== version) {
            throw new Error('Invalid or inconsistent release version at exact merge commit');
          }
          const block = pr.body?.match(/<!-- advent-release:start -->[\s\S]*?<!-- advent-release:end -->/)?.[0];
          if (block?.match(/^Release version: (.+)$/m)?.[1] !== version ||
              !block?.match(/^Prepared source: [a-f0-9]{40}$/m)) throw new Error('Stale Prepare release metadata');
          if (merge?.parents.length !== 2 || merge.parents[1].sha !== pr.head.sha ||
              merge.tree.sha !== source?.tree.sha) throw new Error('Release was not a main-to-deploy merge commit');
          const tagName = `v${version}`;
          const existing = await api(`git/ref/tags/${tagName}`);
          if (existing) {
            let object = existing.object;
            for (let depth = 0; object.type === 'tag' && depth < 10; depth++) {
              object = (await api(`git/tags/${object.sha}`))?.object;
              if (!object) throw new Error('Invalid annotated tag');
            }
            if (object.type !== 'commit' || object.sha !== sha) {
              throw new Error('Existing tag points elsewhere; never move it');
            }
          } else {
            const tag = await api('git/tags', 'POST', {
              tag: tagName,
              message: `Release ${version}\nRelease PR #${pr.number}\nSource ${pr.head.sha}\nDeploy merge ${sha}`,
              object: sha,
              type: 'commit',
            });
            await api('git/refs', 'POST', { ref: `refs/tags/${tagName}`, sha: tag.sha });
          }
          const message = `Finalized ${tagName} on exact deploy merge ${sha}.\n` +
            'This identifies release source; verify Sliplane deployment health separately.\n';
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, message);
          console.log(message);
          NODE
