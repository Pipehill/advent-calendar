name: Code quality
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  quality:
    name: MegaLinter
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out the complete repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Build pinned quality tools
        run: node tools/quality/run.mjs setup
      - name: Check the complete repository
        run: node tools/quality/run.mjs full
      - name: Publish reports even after failure
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: quality-reports-${{ github.run_id }}-${{ github.run_attempt }}
          path: quality-reports/
          if-no-files-found: warn
          retention-days: 14
