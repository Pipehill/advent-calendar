name: Code Quality
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  quality:
    name: Code Quality Checks
    permissions:
      contents: read
      pull-requests: write
    concurrency:
      group: code-quality-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out the complete repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Build pinned quality tools
        id: setup
        run: node tools/quality/run.mjs setup
      - name: Check the complete repository
        id: checks
        run: |
          node --test tools/quality/ci-comment.test.mjs tools/quality/snapshot.test.mjs
          node --test tools/development/environment.test.mjs
          node tools/quality/run.mjs full
          node tools/quality/run.mjs test
      - name: Advisory application, tooling and whole-repository health evidence
        id: health
        if: always()
        continue-on-error: true
        env:
          HEALTH_BASE: ${{ github.event.pull_request.base.sha }}
          HEALTH_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          node tools/quality/install-analysis.mjs
          node --test tools/quality/health.test.mjs
          if [ -n "$HEALTH_BASE" ] && [ -n "$HEALTH_HEAD" ]; then
            node tools/quality/health.mjs pr "$HEALTH_BASE" "$HEALTH_HEAD"
          else
            node tools/quality/health.mjs doctor
          fi
      - name: Publish reports even after failure
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: quality-reports-${{ github.run_id }}-${{ github.run_attempt }}
          path: quality-reports/
          if-no-files-found: warn
          retention-days: 14
      - name: Publish the QA report as a PR comment
        if: >-
          ${{ always() && github.event_name == 'pull_request' &&
              github.event.pull_request.head.repo.full_name == github.repository }}
        env:
          GH_TOKEN: ${{ github.token }}
          QUALITY_SETUP_OUTCOME: ${{ steps.setup.outcome }}
          QUALITY_CHECK_OUTCOME: ${{ steps.checks.outcome }}
          QUALITY_HEALTH_OUTCOME: ${{ steps.health.outcome }}
        run: node tools/quality/ci-comment.mjs
